name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gmd
          POSTGRES_USER: gmd
          POSTGRES_PASSWORD: gmd
        ports:
          - '5432:5432'
        options: >-
          --health-cmd 'pg_isready -U gmd -d gmd'
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: 'postgres://gmd:gmd@127.0.0.1:5432/gmd'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: install deps（无 package-lock 时回退 npm install）
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run lint
      # 类型检查由 build（tsc -p tsconfig.json）覆盖；main 暂无独立 typecheck 脚本
      - run: npm run build
      # M6 时 migrate:prod / seed:prod 脚本暂未入库，直接用编译产物（幂等，各跑两次验证）
      - run: node dist/db/migrate.js
      - run: node dist/db/migrate.js
      - run: node dist/db/seed.js
      - run: node dist/db/seed.js
      - name: start and healthz
        run: |
          npm run start &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/healthz || true)
            [ "$code" = "200" ] && { echo "healthz 200"; exit 0; }
            sleep 1
          done
          echo "healthz not ready (last=$code)"; exit 1
