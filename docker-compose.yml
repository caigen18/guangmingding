# 光明顶 v1 生产编排：db + migrate(一次性) + app + nginx（唯一入口）
# 一条命令起全套：./scripts/init-secrets.sh（生成 .secrets/）→ cp .env.example .env → docker compose up -d --build
# 现状走局域网纯 HTTP（nginx :80，含 IP 直访）；
# 外网访问走 cloudflared 隧道（免费、给域名、不需公网 IP 与备案）或 Tailscale，HTTPS 由隧道处理，不在 compose 里做。

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app-build: &app-build
  build:
    context: .
    dockerfile: Dockerfile
    args:
      GIT_SHA: ${GIT_SHA:-unknown}
  image: gmd-app:${GIT_SHA:-local}
  logging: *logging

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gmd}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: ${POSTGRES_DB:-gmd}
      TZ: ${TZ:-Asia/Shanghai}
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gmd} -d ${POSTGRES_DB:-gmd}"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *logging
    # 不映射宿主端口：只让 app/migrate 容器内部访问

  migrate:
    # 一次性服务：建表(幂等) + 种子(20城，幂等)，跑完 exit 0；app 等它成功后才起。
    # 入口脚本先等 db 就绪并把 /run/secrets/db_password 导出成 DATABASE_URL，再执行下面两条
    <<: *app-build
    restart: "no"
    command: ["sh", "-c", "node dist/db/migrate.js && node dist/db/seed.js"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gmd}
      POSTGRES_DB: ${POSTGRES_DB:-gmd}
      NODE_ENV: production
      TZ: ${TZ:-Asia/Shanghai}
    secrets:
      - db_password
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *app-build
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gmd}
      POSTGRES_DB: ${POSTGRES_DB:-gmd}
      NODE_ENV: production
      TZ: ${TZ:-Asia/Shanghai}
      PORT: '3000'
      SEASON_DAYS: ${SEASON_DAYS:-10}
      AI_MODEL: ${AI_MODEL:-}
      AI_AUTO_PUBLISH: ${AI_AUTO_PUBLISH:-false}
      ADMIN_USER: ${ADMIN_USER:-admin}
    secrets:
      - db_password
      - admin_pass
      - ai_api_key
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    logging: *logging

volumes:
  pgdata:

# 密钥文件（./scripts/init-secrets.sh 生成，0440，属主 1000:1000 = 容器内 node 用户）
# 挂到容器 /run/secrets/<name>，入口脚本读成环境变量后 exec 应用，不写进 environment。
secrets:
  db_password:
    file: ./.secrets/db_password
  admin_pass:
    file: ./.secrets/admin_pass
  ai_api_key:
    file: ./.secrets/ai_api_key
